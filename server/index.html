<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Live Test Rigt</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #121212;
        color: #fff;
      }
      #log {
        background: #000;
        padding: 10px;
        height: 300px;
        overflow-y: scroll;
        border: 1px solid #333;
      }
      .status-on {
        color: #00ff00;
      }
      .status-of {
        color: #ff0000;
      }
    </style>
  </head>
  <body>
    <h1>WebSocket Broadcast Console</h1>
    <p id="status" class="status-of">Connecting...</p>
    <form id="message-form">
      <input
        type="text"
        name=""
        id="message-input"
        required
        placeholder="Send cargo..."
      />
      <button type="submit">Deploy Message</button>
    </form>
    <h3>Live Stream Logs:</h3>
    <pre id="log"></pre>
  </body>
  <script>
    const statusEl = document.getElementById("status");
    const log = document.getElementById("log");
    const input = document.getElementById("message-input");

    // 1. Initiate the Handshake

    const socket = new WebSocket("ws://localhost:8080");
    const appendLog = (label, message) => {
      const entry = `${new Date().toLocaleTimeString()} ${label} ${message}\n`;
      log.textContent = entry + log.textContent;
    };
    socket.addEventListener("open", () => {
      statusEl.textContent = "CONNECTED: ws://localhost:8080";
      statusEl.className = "status-on";
      appendLog("[SYSTEM]", "Tunnel Established");
    });

    socket.addEventListener("close", () => {
      statusEl.textContent = "DISCONNECTED";
      statusEl.className = "status-of";
      appendLog("[SYSTEM]", "Tunnel Collapsed");
    });
    socket.addEventListener("message", (e) => {
      appendLog("[RECIVED]", e.data);
    });

    document.getElementById().addEventListener("submit", (e) => {
      e.preventDefault();
      if (socket.readyState !== WebSocket.OPEN) {
        appendLog("[Error]", "No active tunnel found!");
      }
      const msg = input.value.trim();
      socket.send(msg);
      appendLog("[SEND]", msg);
      input.value = "";
    });
  </script>
</html>
