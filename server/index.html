<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Live Test Rigt</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #121212;
        color: #fff;
      }
      #log {
        background: #000;
        padding: 10px;
        height: 300px;
        overflow-y: scroll;
        border: 1px solid #333;
      }
      .status-on {
        color: #00ff00;
      }
      .status-of {
        color: #ff0000;
      }
    </style>
  </head>
  <body>
    <h1>WebSocket Broadcast Console</h1>
    <p class="status-of">Connecting...</p>
    <form id="message-form">
      <input
        type="text"
        name=""
        id="message-input"
        required
        placeholder="Send cargo..."
      />
      <button type="submit">Deploy Message</button>
    </form>
    <h3>Live Stream Logs:</h3>
    <pre id="log"></pre>
  </body>
  <script></script>
</html>
